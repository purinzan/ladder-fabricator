[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx3-ladder-export"
version = "0.2.4"
description = "Generate validated ladder SVG and explicit connection data from circuit JSON"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE.txt"}
dependencies = []

[project.scripts]
gx3-ladder-export = "gx3_ladder_export.cli:main"

[tool.setuptools.packages.find]
include = ["gx3_ladder_export*"]
