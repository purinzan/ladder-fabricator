<svg xmlns="http://www.w3.org/2000/svg" width="896" height="238" viewBox="0 0 896 238" role="img" data-target="melsec-iq-f">
<title>基本回路の作成例</title>
<defs><linearGradient id="gx3-opcode" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f4f3f3"/><stop offset="50%" stop-color="#d3d3d3"/><stop offset="100%" stop-color="#969796"/></linearGradient></defs>
<style>.wire,.rail,.symbol,.mark{fill:none;stroke:#202020;stroke-width:1;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke;shape-rendering:crispEdges}.grid{stroke:#c6c6c7;stroke-width:0.6;stroke-dasharray:1 2;vector-effect:non-scaling-stroke}.statement{fill:#a2dfdf;stroke:#4c925e;stroke-width:1;vector-effect:non-scaling-stroke;shape-rendering:crispEdges}.label,.heading,.comment{font-family:"Noto Sans CJK JP","Hiragino Sans","MS Gothic","Yu Gothic UI",Meiryo,Arial,sans-serif}.label{font-size:13px;text-anchor:middle;fill:#202020}.heading{font-size:12px;fill:#202020}.comment{font-size:10px;text-anchor:middle;fill:#2f8a48}.opcode{font-family:"Noto Sans CJK JP","Hiragino Sans","MS Gothic","Yu Gothic UI",Meiryo,Arial,sans-serif;font-size:13px;fill:#202020;text-anchor:middle}.instruction-body{fill:white}.instruction-box{fill:none;stroke:#202020;stroke-width:1;vector-effect:non-scaling-stroke;shape-rendering:crispEdges}.opcode-cell{fill:url(#gx3-opcode)}.box-separator{stroke:#c6c6c7;stroke-width:1;vector-effect:non-scaling-stroke}.operand{font-family:"Noto Sans CJK JP","Hiragino Sans","MS Gothic","Yu Gothic UI",Meiryo,Arial,sans-serif;font-size:12px;fill:#202020;text-anchor:middle}</style>
<rect width="896" height="238" fill="white"/>
<g id="shared_branch" transform="translate(0.5 0.5)">
<rect class="statement" x="32" y="14" width="832" height="22"/>
<text class="heading" x="36" y="26">共有接点を保持した並列回路</text>
<line class="grid" x1="32" x2="32" y1="44" y2="216"/>
<line class="grid" x1="136" x2="136" y1="44" y2="216"/>
<line class="grid" x1="240" x2="240" y1="44" y2="216"/>
<line class="grid" x1="344" x2="344" y1="44" y2="216"/>
<line class="grid" x1="448" x2="448" y1="44" y2="216"/>
<line class="grid" x1="552" x2="552" y1="44" y2="216"/>
<line class="grid" x1="656" x2="656" y1="44" y2="216"/>
<line class="grid" x1="760" x2="760" y1="44" y2="216"/>
<line class="grid" x1="864" x2="864" y1="44" y2="216"/>
<line class="grid" x1="32" x2="864" y1="44" y2="44"/>
<line class="grid" x1="32" x2="864" y1="130" y2="130"/>
<line class="grid" x1="32" x2="864" y1="216" y2="216"/>
<line class="rail" data-node="shared_branch:left" x1="32" x2="32" y1="44" y2="216"/>
<line class="rail" data-node="shared_branch:right" x1="864" x2="864" y1="44" y2="216"/>
<polyline class="wire" data-connection="shared_branch:logic-1:fork&gt;shared_branch:logic-1-0" points="240,87.0 379.0,87.0"/>
<polyline class="wire" data-connection="shared_branch:logic-1-0&gt;shared_branch:logic-1:join" points="413.0,87.0 552,87.0"/>
<polyline class="wire" data-connection="shared_branch:logic-1:fork&gt;shared_branch:logic-1-1" points="240,87.0 240,173.0 379.0,173.0"/>
<polyline class="wire" data-connection="shared_branch:logic-1-1&gt;shared_branch:logic-1:join" points="413.0,173.0 552,173.0 552,87.0"/>
<polyline class="wire" data-connection="shared_branch:logic-0&gt;shared_branch:logic-1:fork" points="205.0,87.0 240,87.0"/>
<polyline class="wire" data-connection="shared_branch:logic-1:join&gt;shared_branch:logic-2" points="552,87.0 587.0,87.0"/>
<polyline class="wire" data-connection="shared_branch:left&gt;shared_branch:logic-0" points="32,87.0 171.0,87.0"/>
<polyline class="wire" data-connection="shared_branch:logic-2&gt;shared_branch:output" points="621.0,87.0 800.0,87.0"/>
<polyline class="wire" data-connection="shared_branch:output&gt;shared_branch:right" points="824.0,87.0 864,87.0"/>
<g data-node="shared_branch:logic-0"><title>X0 開始条件</title>
<line class="symbol" x1="171.0" y1="74.0" x2="171.0" y2="100.0"/>
<line class="symbol" x1="205.0" y1="74.0" x2="205.0" y2="100.0"/>
<text class="label" x="188.0" y="63.0">X0</text>
<text class="comment" x="188.0" y="117.0">開始条件</text>
</g>
<g data-node="shared_branch:logic-1-0"><title>X1 条件1</title>
<line class="symbol" x1="379.0" y1="74.0" x2="379.0" y2="100.0"/>
<line class="symbol" x1="413.0" y1="74.0" x2="413.0" y2="100.0"/>
<text class="label" x="396.0" y="63.0">X1</text>
<text class="comment" x="396.0" y="117.0">条件1</text>
</g>
<g data-node="shared_branch:logic-1-1"><title>X2 条件2</title>
<line class="symbol" x1="379.0" y1="160.0" x2="379.0" y2="186.0"/>
<line class="symbol" x1="413.0" y1="160.0" x2="413.0" y2="186.0"/>
<text class="label" x="396.0" y="149.0">X2</text>
<text class="comment" x="396.0" y="203.0">条件2</text>
</g>
<g data-node="shared_branch:logic-2"><title>X3 停止要求</title>
<line class="symbol" x1="587.0" y1="74.0" x2="587.0" y2="100.0"/>
<line class="symbol" x1="621.0" y1="74.0" x2="621.0" y2="100.0"/>
<line class="mark" x1="592.0" y1="98.0" x2="616.0" y2="76.0"/>
<text class="label" x="604.0" y="63.0">X3</text>
<text class="comment" x="604.0" y="117.0">停止要求</text>
</g>
<g data-node="shared_branch:output"><title>Y0 出力</title>
<circle class="symbol" cx="812.0" cy="87.0" r="12"/>
<text class="label" x="812.0" y="57.0">Y0</text>
<text class="comment" x="812.0" y="127.0">出力</text>
</g>
</g>
</svg>
