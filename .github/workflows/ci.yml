name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build
      - run: python run_tests.py
      - run: python -m build --wheel
      - run: gx3-ladder-export examples/basic.json --validate-only

  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install ".[png]"
      - run: python run_tests.py
      - run: ladder-fabricator examples/basic.json -o outputs/basic.png
      - run: python -c "from pathlib import Path; assert Path('outputs/basic.png').read_bytes().startswith(b'\\x89PNG\\r\\n\\x1a\\n')"
